name: CI

# Test first, build second. Nothing here used to run a single assertion: the
# workflow went straight from checkout to `flutter build`, so a commit with
# failing tests — or one that does not compile — got a green check and
# deployed to GitHub Pages. The build and deploy jobs now `needs` the test
# jobs, which is what makes those checks worth anything.
# Pinned deliberately, not a floating channel. simtack/l10n.yaml sets
# `synthetic-package: false` so that `flutter gen-l10n` writes into
# simtack/lib/l10n/ instead of the synthetic package under .dart_tool/ —
# without it the committed localisations are frozen snapshots and editing an
# ARB changes nothing in the running app. That option was deprecated and then
# removed in later Flutter releases, and l10n generation runs as part of
# `flutter pub get`, so on a floating channel this workflow would eventually go
# red over a config change nobody made. Pinning also keeps pubspec.lock honest:
# intl is locked at 0.19.0, which is what the vendored SDK in ../flutter
# (3.22.3) resolves, while newer channels pin 0.20.x and would quietly rewrite
# the lock on every run.
# Bump this together with ../flutter, and re-run both suites when you do.
env:
  FLUTTER_VERSION: "3.22.3"

on:
  push:
    branches: [main, madrine]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Needed for the deploy-web job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        # The FastAPI project lives in Backend-fastapi/, not the repo root.
        working-directory: Backend-fastapi
    # A real PostgreSQL, not SQLite: the app leans on `func.concat`,
    # timezone-aware timestamps and TRUNCATE ... RESTART IDENTITY, and
    # tests/conftest.py runs `alembic upgrade head` against a `_test`
    # database it creates itself. Running on SQLite would test a schema
    # that never ships.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atomy
          POSTGRES_PASSWORD: atomy123
          POSTGRES_DB: atomybridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atomy -d atomybridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Matches .env.example so CI and a laptop cannot drift apart.
      DATABASE_URL: postgresql+psycopg://atomy:atomy123@localhost:5432/atomybridge
      # Meets the 32-character floor in Settings; CI must never hold a real key.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned rather than "latest": psycopg[binary]==3.2.1 has no wheel
          # for the interpreter version used on some dev machines, and a
          # source build would need libpq headers the runner may not have.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend-fastapi/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        # conftest.py applies every migration before the first test, so a
        # broken revision fails here rather than on someone's deploy.
        run: python -m pytest -q

  test-flutter:
    name: Flutter tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simtack
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Version, not just channel — see the note above `on:`.
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Only errors fail this step. The project carries a backlog of
        # warnings and infos (unused imports, prefer_const, ...) that would
        # make a strict gate red on day one, and a gate that is always red
        # is a gate nobody reads. Errors — the ones that mean "this does not
        # build" — are fatal. Remove the two flags once that backlog is
        # cleared.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run widget and unit tests
        run: flutter test

  build-apk:
    name: Build Android APK
    # Pointless to spend minutes compiling an APK for a commit that fails its
    # tests, and a red commit must not produce an installable artifact.
    needs: [test-backend, test-flutter]
    runs-on: ubuntu-latest
    defaults:
      run:
        # Every step below runs with this as the working directory, since the
        # Flutter project lives in simtack/, not the repo root.
        working-directory: simtack
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Version, not just channel — see the note above `on:`.
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atomybridge-apk
          # Flutter always writes the release APK here, regardless of app name.
          path: simtack/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-web:
    name: Build Web
    needs: [test-backend, test-flutter]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simtack
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Version, not just channel — see the note above `on:`.
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release web bundle
        # base-href must match the repo name — GitHub Pages serves a project
        # site at https://<user>.github.io/<repo>/, and Flutter needs to know
        # that subpath to load its JS/asset files correctly instead of
        # looking for them at the domain root.
        run: flutter build web --release --base-href "/Simulation-app/"

      - name: Upload web build (plain artifact, always)
        uses: actions/upload-artifact@v4
        with:
          name: atomybridge-web
          path: simtack/build/web
          if-no-files-found: error

      - name: Upload web build for Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: simtack/build/web

  deploy-web:
    name: Deploy Web to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Scoped to just this job — only one Pages deployment at a time, without
    # cancelling unrelated in-flight APK/web build jobs.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
