name: Build APK & Web

on:
  push:
    branches: [main, madrine]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

defaults:
  run:
    # Every step below runs with this as the working directory, since the
    # Flutter project lives in atomybridge_app/, not the repo root.
    working-directory: atomybridge_app

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atomybridge-apk
          # Flutter always writes the release APK here, regardless of app name.
          path: atomybridge_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release web bundle
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: atomybridge-web
          path: atomybridge_app/build/web
          if-no-files-found: error
