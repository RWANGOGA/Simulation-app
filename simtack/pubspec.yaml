name: simtack
description: "Simtack: A Tactile Human Digital Twin Architecture for Accessible Medical Triage"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  model_viewer_plus: ^1.7.0
  webview_flutter: ^4.8.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  cupertino_icons: ^1.0.6
  math_expressions: ^2.4.0
  share_plus: ^7.2.1
  universal_html: ^2.2.4
  cross_file: ^0.3.4+2
  pointer_interceptor: ^0.10.1
  url_launcher: ^6.2.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.3.1
  web: ^1.1.0
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.3
  connectivity_plus: ^6.0.5
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  plugin_platform_interface: ^2.1.8
  webview_flutter_platform_interface: ^2.10.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/
    - assets/avatars/
    - assets/anatomy/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 800
