<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Simtack: A Tactile Human Digital Twin Architecture for Accessible Medical Triage">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Simtack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Simtack</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- 3D Engine for model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
  <!-- ⚠️ THIS IS THE MOST CRITICAL LINE. Without it, Flutter Web will never start and shows a blank screen. -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- YOUR EXCELLENT 3D MODEL CLICK DETECTION SCRIPT -->
  <script type="module">
    function attachBodyTapListener(viewer) {
      if (viewer.dataset.atomybridgeListenerAttached === 'true') return;

      const src = viewer.getAttribute('src') || '';
      if (src.indexOf('human_body') === -1) {
        return; 
      }

      viewer.dataset.atomybridgeListenerAttached = 'true';
      console.log('✅ Found human body model-viewer, attaching listener...');

      viewer.addEventListener('click', (event) => {
        const rect = viewer.getBoundingClientRect();
        const pixelX = event.clientX - rect.left;
        const pixelY = event.clientY - rect.top;

        const hit = viewer.positionAndNormalFromPoint(pixelX, pixelY);
        if (!hit) {
          console.log('🩺 Tap missed the model (no hit) at', pixelX, pixelY);
          return;
        }

        const dims = viewer.getDimensions();
        const center = viewer.getBoundingBoxCenter();
        const minX = center.x - dims.x / 2;
        const minY = center.y - dims.y / 2;

        const rx = (hit.position.x - minX) / dims.x;
        const ry = 1 - (hit.position.y - minY) / dims.y;

        let part = 'Unknown';
        if (ry < 0.20) {
          part = 'Headache / Cranial';
        } else if (ry < 0.50) {
          if (rx < 0.30) {
            part = 'Right Arm / Shoulder';
          } else if (rx > 0.70) {
            part = 'Left Arm / Shoulder';
          } else if (ry < 0.35) {
            part = 'Chest / Heart';
          } else {
            part = 'Abdomen (Upper)';
          }
        } else {
          if (rx < 0.45) {
            part = 'Right Leg / Knee';
          } else {
            part = 'Left Leg / Knee';
          }
        }

        console.log('🩺 Model tapped! Part:', part, '| normalized rx/ry:', rx.toFixed(2), ry.toFixed(2));

        window.dispatchEvent(new CustomEvent('atomybridge-bodypart', {
          detail: { part: part, x: rx, y: ry }
        }));
      });
    }

    function scanForBodyModelViewers(root) {
      if (root.tagName === 'MODEL-VIEWER') {
        attachBodyTapListener(root);
      }
      if (root.querySelectorAll) {
        root.querySelectorAll('model-viewer').forEach(attachBodyTapListener);
      }
    }

    customElements.whenDefined('model-viewer').then(() => {
      scanForBodyModelViewers(document.body);

      const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          mutation.addedNodes.forEach((node) => {
            if (node.nodeType === Node.ELEMENT_NODE) {
              scanForBodyModelViewers(node);
            }
          });
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
</body>
</html>
