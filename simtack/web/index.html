<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Simtack: A Tactile Human Digital Twin Architecture for Accessible Medical Triage">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Simtack">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Simtack</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- 3D Engine for model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
  <!-- ⚠️ THIS IS THE MOST CRITICAL LINE. Without it, Flutter Web will never start and shows a blank screen. -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- YOUR EXCELLENT 3D MODEL CLICK DETECTION SCRIPT -->
  <script type="module">
    // Gives the body model a translucent, blue-tinted "X-ray" look instead
    // of its plain grey material — no new 3D asset needed, this just edits
    // the material already on the existing, known-good model files via
    // model-viewer's live material API.
    function applyXrayMaterial(viewer) {
      const tint = () => {
        const materials = viewer.model && viewer.model.materials;
        if (!materials || materials.length === 0) return;

        materials.forEach((material) => {
          // Requires alpha blending to be turned on — a fully opaque
          // material ignores the alpha channel below no matter what it's
          // set to.
          material.setAlphaMode('BLEND');
          material.pbrMetallicRoughness.setBaseColorFactor([0.35, 0.65, 1.0, 0.4]);
          material.pbrMetallicRoughness.setMetallicFactor(0.1);
          material.pbrMetallicRoughness.setRoughnessFactor(0.4);
          // A faint glow so the body doesn't just look like dim grey glass.
          // Not every material configuration exposes this — skip quietly
          // if it doesn't rather than breaking the rest of the tint.
          try {
            material.setEmissiveFactor([0.15, 0.35, 0.6]);
          } catch (_) {}
        });
      };

      if (viewer.loaded) {
        tint();
      } else {
        viewer.addEventListener('load', tint, { once: true });
      }
    }

    function attachBodyTapListener(viewer) {
      if (viewer.dataset.atomybridgeListenerAttached === 'true') return;

      const src = viewer.getAttribute('src') || '';
      if (src.indexOf('human_body') === -1) {
        return; 
      }

      viewer.dataset.atomybridgeListenerAttached = 'true';
      console.log('✅ Found human body model-viewer, attaching listener...');

      applyXrayMaterial(viewer);

      viewer.addEventListener('click', (event) => {
        const rect = viewer.getBoundingClientRect();
        const pixelX = event.clientX - rect.left;
        const pixelY = event.clientY - rect.top;

        const hit = viewer.positionAndNormalFromPoint(pixelX, pixelY);
        if (!hit) {
          console.log('🩺 Tap missed the model (no hit) at', pixelX, pixelY);
          return;
        }

        const dims = viewer.getDimensions();
        const center = viewer.getBoundingBoxCenter();
        const minX = center.x - dims.x / 2;
        const minY = center.y - dims.y / 2;

        const nx = (hit.position.x - minX) / dims.x;
        const ny = 1 - (hit.position.y - minY) / dims.y;

        let part = 'Unknown';
        if (ny < 0.18) {
          part = 'Headache / Cranial';
        } else if (ny < 0.28) {
          if (nx < 0.35) {
            part = 'Right Arm / Shoulder';
          } else if (nx > 0.65) {
            part = 'Left Arm / Shoulder';
          } else {
            part = 'Neck';
          }
        } else if (ny < 0.42) {
          part = 'Chest / Heart';
        } else if (ny < 0.58) {
          part = 'Abdomen';
        } else if (ny < 0.70) {
          if (nx < 0.40) {
            part = 'Right Leg / Knee';
          } else if (nx > 0.60) {
            part = 'Left Leg / Knee';
          } else {
            part = 'Hips / Groin';
          }
        } else {
          if (nx < 0.40) {
            part = 'Right Leg / Knee';
          } else if (nx > 0.60) {
            part = 'Left Leg / Knee';
          } else {
            part = 'Thighs';
          }
        }

        const screenX = pixelX / rect.width;
        const screenY = pixelY / rect.height;

        console.log('🩺 Model tapped! Part:', part, '| body-space nx/ny:', nx.toFixed(2), ny.toFixed(2), '| screen x/y:', screenX.toFixed(2), screenY.toFixed(2));

        window.dispatchEvent(new CustomEvent('atomybridge-bodypart', {
          detail: { part: part, x: screenX, y: screenY }
        }));
      });
    }

    function scanForBodyModelViewers(root) {
      if (root.tagName === 'MODEL-VIEWER') {
        attachBodyTapListener(root);
      }
      if (root.querySelectorAll) {
        root.querySelectorAll('model-viewer').forEach(attachBodyTapListener);
      }
    }

    customElements.whenDefined('model-viewer').then(() => {
      scanForBodyModelViewers(document.body);

      const observer = new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          mutation.addedNodes.forEach((node) => {
            if (node.nodeType === Node.ELEMENT_NODE) {
              scanForBodyModelViewers(node);
            }
          });
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });

    // Suppress "Blocked aria-hidden on an element because its descendant
    // retained focus" warnings. Flutter wraps each platform view in a
    // <flt-platform-view aria-hidden="true">; the WebView inside still
    // owns focus, which trips the WAI-ARIA rule. Setting `inert` on the
    // same element removes it from the focus chain and keeps the screen-
    // reader semantics correct. The model_viewer_plus code applies
    // aria-hidden to its own wrapper, so this stays in sync via the
    // MutationObserver below.
    function applyInertToPlatformViews(root) {
      if (!root || !root.querySelectorAll) return;
      root.querySelectorAll('flt-platform-view[aria-hidden="true"]').forEach((el) => {
        try { el.inert = true; } catch (_) {}
      });
    }
    applyInertToPlatformViews(document.body);
    new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) {
            applyInertToPlatformViews(node);
          }
        }
        if (mutation.type === 'attributes' && mutation.target) {
          applyInertToPlatformViews(mutation.target);
        }
      }
    }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['aria-hidden'] });
  </script>
</body>
</html>
