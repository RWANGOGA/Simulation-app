<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="atomybridge_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>atomybridge_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- 3D Engine for model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      var downX = 0, downY = 0;

      window.addEventListener('pointerdown', function (e) {
        downX = e.clientX; downY = e.clientY;
      }, true);

      window.addEventListener('click', function (e) {
        // 🛑 MAGIC FIX: IGNORE clicks on the Flutter UI (buttons, chips, sliders)
        if (e.target.tagName === 'CANVAS' || e.target.tagName === 'FLT-GLASS-PANE') return;
        if (e.target.closest && e.target.closest('flt-glass-pane')) return;

        // If moved more than 8 pixels, it's a drag (camera rotation), not a tap
        if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 8) return;

        // Only process clicks directly on the model-viewer
        var mv = e.target.closest ? e.target.closest('model-viewer') : null;
        if (!mv) return;
        
        // Only process clicks on the human body model (not the avatar)
        var src = mv.getAttribute('src') || '';
        if (src.indexOf('human_body') === -1) return;

        var r = mv.getBoundingClientRect();
        var rx = (e.clientX - r.left) / r.width;  // 0 = left edge, 1 = right edge
        var ry = (e.clientY - r.top) / r.height;  // 0 = top (head), 1 = bottom (feet)
        
        var part = null;
        
        // Simple grid-based detection
        if (ry < 0.20) {
          part = 'Head';
        } else if (ry < 0.50) {
          // Upper body
          if (rx < 0.25) {
            part = 'Right Arm';
          } else if (rx > 0.75) {
            part = 'Left Arm';
          } else if (ry < 0.35) {
            part = 'Chest';
          } else {
            part = 'Abdomen';
          }
        } else {
          // Lower body (legs)
          if (rx < 0.45) {
            part = 'Right Leg';
          } else {
            part = 'Left Leg';
          }
        }

        console.log('🩺 Body tap at rx=' + rx.toFixed(2) + ', ry=' + ry.toFixed(2) + ' →', part);
        window.dispatchEvent(new CustomEvent('atomybridge-bodypart', { detail: part }));
      }, true);
    })();
  </script>
</body>
</html>
