<!DOCTYPE html>
<html>
<head>
<!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
<base href="$FLUTTER_BASE_HREF">

<meta charset="UTF-8">
<meta content="IE=Edge" http-equiv="X-UA-Compatible">
<meta name="description" content="A new Flutter project.">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- iOS meta tags & icons -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="atomybridge_app">
<link rel="apple-touch-icon" href="icons/Icon-192.png">

<!-- Favicon -->
<link rel="icon" type="image/png" href="favicon.png"/>

<title>atomybridge_app</title>
<link rel="manifest" href="manifest.json">

<!-- 3D Engine for model-viewer -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
<script type="module">
  // Wait for model-viewer custom element to be defined
  customElements.whenDefined('model-viewer').then(() => {
    // Give Flutter time to render the model
    setTimeout(() => {
      // Find ALL model-viewer elements on the page
      const viewers = document.querySelectorAll('model-viewer');
      
      viewers.forEach((viewer) => {
        // Check if this is the human body model (not the avatar)
        const src = viewer.getAttribute('src') || '';
        if (src.indexOf('human_body') === -1 && src.indexOf('models/human_body') === -1) {
          return; // Skip non-body models
        }
        
        console.log('✅ Found human body model-viewer, attaching listener...');
        
        // Listen for the native 'select' event (fires when user taps/clicks on the 3D model)
        viewer.addEventListener('select', (event) => {
          const intersection = event.detail.intersection;
          
          if (intersection && intersection.point) {
            // Get the 3D intersection point
            const point = intersection.point;
            
            // Calculate UV coordinates (0-1 range)
            const uv = intersection.uv || { x: 0.5, y: 0.5 };
            const rx = uv.x;
            const ry = uv.y;
            
            // Determine body part based on Y (height) and X (width)
            let part = 'Unknown';
            
            if (ry < 0.20) {
              part = 'Headache / Cranial';
            } else if (ry < 0.50) {
              // Upper body
              if (rx < 0.30) {
                part = 'Right Arm / Shoulder';
              } else if (rx > 0.70) {
                part = 'Left Arm / Shoulder';
              } else if (ry < 0.35) {
                part = 'Chest / Heart';
              } else {
                part = 'Abdomen (Upper)';
              }
            } else {
              // Lower body
              if (rx < 0.45) {
                part = 'Right Leg / Knee';
              } else {
                part = 'Left Leg / Knee';
              }
            }
            
            console.log('🩺 Model tapped! Part:', part, '| UV:', rx.toFixed(2), ry.toFixed(2));
            
            // Dispatch custom event for Flutter to catch
            window.dispatchEvent(new CustomEvent('atomybridge-bodypart', {
              detail: { part: part, x: rx, y: ry }
            }));
          }
        });
        
        // Also add a fallback click listener
        viewer.addEventListener('click', (e) => {
          console.log(' Click detected on model-viewer element');
        });
      });
      
      if (viewers.length === 0) {
        console.warn('⚠️ No model-viewer elements found on page!');
      }
    }, 2000); // Wait 2 seconds for Flutter to render
  });
</script>
</body>
</html>
